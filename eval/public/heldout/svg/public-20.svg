<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1240" viewBox="0 0 1240 1240">
<rect width="1240" height="1240" fill="#fffdf7"/>
<g font-family="Hiragino Mincho ProN, Hiragino Sans, serif" fill="#222">
<text x="90" y="100" font-size="30">令和8年12月14日</text>
<text x="90" y="150" font-size="30">保護者の皆様</text>
<text x="800" y="100" font-size="30">みなと小学校</text>
<text x="800" y="150" font-size="30">校長　山本　一郎</text>
<text x="620" y="265" font-size="56" text-anchor="middle" font-weight="bold">冬休みのくらしについて</text>
<text x="90" y="345" font-size="32">　師走を迎え、何かと気ぜわしい季節となりました。日ごろより本校の</text>
<text x="90" y="392" font-size="32">教育活動にご理解とご協力をいただき、ありがとうございます。</text>
<text x="90" y="439" font-size="32">　さて、下記のとおり冬休みを迎えます。お子さまが安全で規則正しい</text>
<text x="90" y="486" font-size="32">生活を送れるよう、ご家庭でもお声がけをお願いいたします。</text>
<text x="620" y="560" font-size="40" text-anchor="middle">記</text>
<text x="140" y="635" font-size="34">１．終業式　　12月23日（水）</text>
<text x="140" y="687" font-size="34">　　　給食はありません。11時30分に一斉下校します。</text>
<text x="140" y="739" font-size="34">　　　※お迎えが必要な場合は、各ご家庭でご対応ください。</text>
<text x="140" y="805" font-size="34">２．冬休み　　12月24日（木）〜1月7日（木）</text>
<text x="140" y="871" font-size="34">３．始業式　　1月8日（金）　8時20分　登校</text>
<text x="140" y="923" font-size="34">　　　持ち物　通知表・冬休みの宿題・上ばき・ぞうきん2枚</text>
<text x="140" y="989" font-size="34">４．冬休みのくらし</text>
<text x="140" y="1041" font-size="34">　　・早ね・早おきをして、規則正しい生活をしましょう。</text>
<text x="140" y="1093" font-size="34">　　・行き先と帰る時刻を家の人に伝えてから出かけましょう。</text>
<text x="140" y="1145" font-size="34">　　・交通ルールを守り、暗くなる前に家に帰りましょう。</text>
<text x="1150" y="1205" font-size="32" text-anchor="end">以上</text>
</g></svg>
