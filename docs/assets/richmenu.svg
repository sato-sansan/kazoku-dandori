  </g>

  <g id="t2">
    <rect x="650" y="203" width="585" height="625" rx="44" fill="#9FC4E6"/>
    <rect x="650" y="195" width="585" height="625" rx="44" fill="url(#b)" stroke="#FFFFFF" stroke-width="4"/>
    <g transform="translate(942 462) scale(1.35)">
      <ellipse cx="0" cy="66" rx="128" ry="12" fill="#8FB6DB" opacity="0.6"/>
      <path d="M-124 20 v-32 q0 -22 22 -22 l22 -50 q8 -16 26 -16 h108 q18 0 26 16 l22 50 q22 0 22 22 v32 q0 16 -16 16 h-216 q-16 0 -16 -16z" fill="url(#white)" stroke="#4A3B2A" stroke-width="8" stroke-linejoin="round"/>
      <path d="M-78 -30 l16 -38 h44 v38z M-6 -30 v-38 h44 l16 38z" fill="url(#glass)" stroke="#4A3B2A" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-66 -60 l10 -4 l-14 30z" fill="#FFFFFF" opacity="0.8"/>
      <rect x="-124" y="-8" width="248" height="10" fill="#E4E7EC"/>
      <circle cx="-72" cy="40" r="28" fill="#3A2E22"/><circle cx="-72" cy="40" r="12" fill="#D9DCE2"/>
      <circle cx="72" cy="40" r="28" fill="#3A2E22"/><circle cx="72" cy="40" r="12" fill="#D9DCE2"/>
      <circle cx="-104" cy="4" r="10" fill="#FFD23F" stroke="#4A3B2A" stroke-width="3"/><circle cx="104" cy="4" r="10" fill="#FFD23F" stroke="#4A3B2A" stroke-width="3"/>
    </g>
    <text x="942" y="770" font-size="104" font-weight="700" fill="#3A2F24" text-anchor="middle">お迎え</text>
  </g>

  <g id="t3">
    <rect x="1265" y="203" width="585" height="625" rx="44" fill="#E6AEB8"/>
    <rect x="1265" y="195" width="585" height="625" rx="44" fill="url(#p)" stroke="#FFFFFF" stroke-width="4"/>
    <g transform="translate(1557 450) scale(1.35)">
      <ellipse cx="0" cy="104" rx="90" ry="10" fill="#E8A9B4" opacity="0.6"/>
      <circle cx="0" cy="0" r="100" fill="url(#face)" stroke="#4A3B2A" stroke-width="8"/>
      <path d="M-70 -78 q0 -14 14 -14 h112 q14 0 14 14 v26 q0 14 -14 14 h-112 q-14 0 -14 -14z" fill="#BFE4FF" stroke="#4A3B2A" stroke-width="6"/>
      <rect x="-56" y="-84" width="112" height="6" rx="3" fill="#FFFFFF" opacity="0.8"/>
      <ellipse cx="-34" cy="12" rx="8" ry="10" fill="#3A2E22"/><ellipse cx="34" cy="12" rx="8" ry="10" fill="#3A2E22"/>
      <circle cx="-31" cy="8" r="3" fill="#FFFFFF"/><circle cx="37" cy="8" r="3" fill="#FFFFFF"/>
      <ellipse cx="-58" cy="36" rx="14" ry="9" fill="#FFA5AD"/><ellipse cx="58" cy="36" rx="14" ry="9" fill="#FFA5AD"/>
      <path d="M-14 52 Q0 40 14 52" fill="none" stroke="#4A3B2A" stroke-width="6" stroke-linecap="round"/>
      <path d="M78 -40 q14 8 6 22 q-12 -2 -6 -22z" fill="#9CCBFF" stroke="#4A3B2A" stroke-width="4" stroke-linejoin="round"/>
      <g transform="rotate(-25)">
        <rect x="18" y="40" width="120" height="24" rx="12" fill="#FFFFFF" stroke="#4A3B2A" stroke-width="6"/>
        <rect x="26" y="47" width="64" height="10" rx="5" fill="#E0503F"/>
        <circle cx="128" cy="52" r="6" fill="#E0503F"/>
      </g>
    </g>
    <text x="1557" y="770" font-size="104" font-weight="700" fill="#3A2F24" text-anchor="middle">休みの連絡</text>
  </g>

  <g id="t4">
    <rect x="1880" y="203" width="585" height="625" rx="44" fill="#A9CF9A"/>
    <rect x="1880" y="195" width="585" height="625" rx="44" fill="url(#g)" stroke="#FFFFFF" stroke-width="4"/>
    <g transform="translate(2172 450) scale(1.35)">
      <rect x="-70" y="-90" width="160" height="200" rx="14" fill="#9DBF8E" opacity="0.5" transform="rotate(6)"/>
      <rect x="-80" y="-100" width="160" height="200" rx="14" fill="url(#white)" stroke="#4A3B2A" stroke-width="8"/>
      <path d="M-50 -60 h100 M-50 -25 h100 M-50 10 h70" stroke="#B9B0A2" stroke-width="10" stroke-linecap="round"/>
      <path d="M-46 -82 c-8 -10 -20 -2 -12 8 l12 12 l12 -12 c8 -10 -4 -18 -12 -8z" fill="#FF8F9A"/>
