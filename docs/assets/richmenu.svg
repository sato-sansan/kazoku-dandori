<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="843" viewBox="0 0 2500 843" font-family="Zen Maru Gothic, Hiragino Maru Gothic ProN, Hiragino Sans, sans-serif">
  <!-- だんどりさんのホーム画面（LINE リッチメニュー 2500×843）。絵は期間中に自作。直したら scripts/svg2png.swift で PNG にして、グループで「リッチメニュー 作り直し」 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9EC"/><stop offset="1" stop-color="#FFEFD6"/></linearGradient>
    <radialGradient id="body" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFBEF"/><stop offset="1" stop-color="#FFE3A6"/></radialGradient>
    <radialGradient id="face" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFF4D6"/><stop offset="1" stop-color="#FFD98F"/></radialGradient>
    <linearGradient id="y" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0BC"/><stop offset="1" stop-color="#FFE194"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEEFF"/><stop offset="1" stop-color="#BFDFFF"/></linearGradient>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE1E6"/><stop offset="1" stop-color="#FFCBD4"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3F5D9"/><stop offset="1" stop-color="#C9ECBB"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF0F4"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7B6B"/><stop offset="1" stop-color="#E0503F"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFE9FF"/><stop offset="1" stop-color="#7FBBFF"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BDE8A6"/><stop offset="1" stop-color="#7FC46A"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A4A3A"/><stop offset="1" stop-color="#3A2E22"/></linearGradient>
  </defs>
  <rect width="2500" height="843" fill="url(#bg)"/>

  <!-- 上の帯：だんどりさん -->
  <g transform="translate(132 112)">
    <!-- 双葉 -->
    <path d="M2 -72 q-6 -30 -34 -36 q4 28 34 36z" fill="url(#leaf)" stroke="#4A3B2A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M2 -72 q6 -30 34 -36 q-4 28 -34 36z" fill="url(#leaf)" stroke="#4A3B2A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M2 -44 v-28" stroke="#4A3B2A" stroke-width="4" stroke-linecap="round"/>
    <!-- 体 -->
    <path d="M-80 12 q-6 -80 80 -84 q86 4 80 84 q-4 62 -80 66 q-76 -4 -80 -66z" fill="url(#body)" stroke="#4A3B2A" stroke-width="5"/>
    <ellipse cx="-30" cy="-34" rx="22" ry="12" fill="#FFFFFF" opacity="0.7" transform="rotate(-20 -30 -34)"/>
    <!-- 手 -->
    <ellipse cx="-84" cy="36" rx="17" ry="12" fill="url(#body)" stroke="#4A3B2A" stroke-width="5" transform="rotate(-30 -84 36)"/>
    <ellipse cx="86" cy="18" rx="17" ry="12" fill="url(#body)" stroke="#4A3B2A" stroke-width="5" transform="rotate(35 86 18)"/>
    <!-- 目（きらきら） -->
    <ellipse cx="-30" cy="8" rx="11" ry="14" fill="#3A2E22"/>
    <ellipse cx="30" cy="8" rx="11" ry="14" fill="#3A2E22"/>
    <circle cx="-26" cy="2" r="4.5" fill="#FFFFFF"/><circle cx="34" cy="2" r="4.5" fill="#FFFFFF"/>
    <circle cx="-33" cy="13" r="2" fill="#FFFFFF"/><circle cx="27" cy="13" r="2" fill="#FFFFFF"/>
    <!-- ほっぺ・口 -->
    <ellipse cx="-54" cy="28" rx="13" ry="9" fill="#FFB1B6" opacity="0.9"/>
    <ellipse cx="54" cy="28" rx="13" ry="9" fill="#FFB1B6" opacity="0.9"/>
    <path d="M-12 30 q12 16 24 0" fill="#E0503F" stroke="#4A3B2A" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="246" y="122" font-size="72" font-weight="700" fill="#4A3B2A">だんどりさん</text>
  <!-- ふきだし -->
  <g transform="translate(2470 96)">
    <rect x="-566" y="-54" width="566" height="108" rx="54" fill="#FFFFFF" stroke="#EAD9BA" stroke-width="4"/>
    <path d="M-566 -4 l-30 10 l30 18z" fill="#FFFFFF" stroke="#EAD9BA" stroke-width="4" stroke-linejoin="round"/>
    <text x="-283" y="20" font-size="54" font-weight="700" fill="#7A6A56" text-anchor="middle">きょうも、おまかせ！</text>
  </g>

