        <circle cx="0" cy="8" r="28" fill="#FFFFFF"/>
        <circle cx="0" cy="8" r="18" fill="url(#glass)"/>
        <circle cx="-6" cy="2" r="5" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="44" cy="-18" r="6" fill="#FFD23F"/>
      </g>
    </g>
    <text x="2172" y="770" font-size="104" font-weight="700" fill="#3A2F24" text-anchor="middle">お便り</text>
