    <g transform="translate(327 450) scale(1.35)">
      <rect x="-96" y="-72" width="200" height="180" rx="22" fill="#D8C27E" opacity="0.5"/>
      <rect x="-100" y="-80" width="200" height="180" rx="22" fill="url(#white)" stroke="#4A3B2A" stroke-width="8"/>
      <path d="M-100 -58 q0 -22 22 -22 h156 q22 0 22 22 v28 h-200z" fill="url(#red)"/>
      <rect x="-86" y="-70" width="172" height="8" rx="4" fill="#FFFFFF" opacity="0.45"/>
      <rect x="-62" y="-102" width="18" height="48" rx="9" fill="#8A8F99" stroke="#4A3B2A" stroke-width="4"/>
      <rect x="44" y="-102" width="18" height="48" rx="9" fill="#8A8F99" stroke="#4A3B2A" stroke-width="4"/>
      <circle cx="-55" cy="12" r="11" fill="#4A3B2A"/><circle cx="0" cy="12" r="11" fill="#4A3B2A"/><circle cx="55" cy="12" r="11" fill="#4A3B2A"/>
      <circle cx="-55" cy="62" r="11" fill="#4A3B2A"/>
      <path d="M0 74 c-16 -20 -38 -6 -24 14 l24 22 l24 -22 c14 -20 -8 -34 -24 -14z" fill="url(#red)" stroke="#4A3B2A" stroke-width="3"/>
      <circle cx="55" cy="62" r="11" fill="#4A3B2A"/>
